name: Build Windows desktop executable
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test automatic scoring and desktop UI
        run: |
          python -m pytest -q
          python desktop.py --self-test --output desktop-smoke.json
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BearsGrader --add-data "assets;assets" desktop.py
      - name: Test packaged executable and bundled baseline
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/BearsGrader.exe -ArgumentList '--self-test','--output','packaged-smoke.json' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged app self-test timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed: $($process.ExitCode)" }
          if (-not (Test-Path packaged-smoke.json)) { throw 'Self-test result missing' }
          $result = Get-Content packaged-smoke.json | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged app did not pass' }
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: BearsGrader-Windows
          path: dist/BearsGrader.exe
          if-no-files-found: error
      - name: Publish executable for tagged versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/BearsGrader.exe" --title "Bears Grader $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      - name: Record build outcome for Git-only clients
        if: always()
        shell: pwsh
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
        run: |
          # A small immutable result branch lets Git-only clients verify the build.
          # No source files or binaries are committed to main by the build job.
          @{ status=$env:BUILD_STATUS; commit=$env:BUILD_COMMIT; ref=$env:BUILD_REF; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT } | ConvertTo-Json | Set-Content -Encoding utf8 build-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $blob = git hash-object -w build-result.json
          $tree = "100644 blob $blob`tbuild-result.json" | git mktree
          $commit = git commit-tree $tree -p HEAD -m 'Record Windows build outcome'
          git push origin "${commit}:refs/heads/build-results/windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
